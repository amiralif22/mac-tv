name: Companion remotes

on:
  push:
    branches: ["arena/**"]
    paths:
      - "remote-android/**"
      - "remote-ios/**"
      - "shared/**"
      - ".github/workflows/remote-remotes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android remote
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build everything, capture output
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --continue --console=plain --stacktrace > /tmp/build.log 2>&1
          echo "exit=$?" > /tmp/exit.txt

      - name: Publish diagnostics as annotations
        if: always()
        run: |
          python3 - <<'PY'
          log = open('/tmp/build.log', errors='replace').read().splitlines()
          keep = []
          for line in log:
              s = line.strip()
              if (s.startswith('e: ') or s.startswith('w: file') or 'error:' in s
                      or s.startswith('FAILURE:') or s.startswith('* What went wrong')
                      or s.startswith('Caused by') or s.startswith('Execution failed')
                      or 'Task failed' in s or s.startswith('FAILED')
                      or 'tests completed' in s):
                  keep.append(s)
          text = '\n'.join(keep[-400:]) or '(no error lines matched)'
          text += '\n\nEXIT: ' + open('/tmp/exit.txt').read().strip()
          text += '\n\nTAIL:\n' + '\n'.join(log[-20:])
          msg = text[:60000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=gradle::' + msg)
          PY

  ios:
    name: iOS remote
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Protocol kit tests and app build, capture output
        run: |
          set +e
          {
            echo "=== swift test ==="
            swift test --package-path remote-ios/RemoteKit 2>&1
            echo "swift_exit=$?"
          } > /tmp/ios.log 2>&1
          brew install xcodegen >> /tmp/ios.log 2>&1
          {
            echo "=== xcodebuild ==="
            cd remote-ios
            xcodegen generate 2>&1
            xcodebuild -project CouchRemote.xcodeproj \
                       -scheme CouchRemote \
                       -destination 'generic/platform=iOS' \
                       -configuration Debug \
                       CODE_SIGNING_ALLOWED=NO \
                       build 2>&1
            echo "xcodebuild_exit=$?"
          } >> /tmp/ios.log 2>&1
          tail -5 /tmp/ios.log

      - name: Publish diagnostics as annotations
        if: always()
        run: |
          python3 - <<'PY'
          log = open('/tmp/ios.log', errors='replace').read().splitlines()
          keep = []
          for line in log:
              s = line.strip()
              if ('error:' in s or s.startswith('error ') or 'swift_exit=' in s
                      or 'xcodebuild_exit=' in s or s.startswith('===')):
                  keep.append(s[:400])
          text = '\n'.join(keep[-300:]) or '(no error lines matched)'
          text += '\n\nTAIL:\n' + '\n'.join(l[:400] for l in log[-25:])
          msg = text[:60000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=ios::' + msg)
          PY
