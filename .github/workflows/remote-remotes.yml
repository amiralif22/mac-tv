name: Companion remotes

on:
  push:
    paths:
      - "remote-android/**"
      - "remote-ios/**"
      - "shared/**"
      - ".github/workflows/remote-remotes.yml"
  pull_request:
    paths:
      - "remote-android/**"
      - "remote-ios/**"
      - "shared/**"
      - ".github/workflows/remote-remotes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android remote
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v4 defaults to `platform-tools` only; v3 asked for the legacy `tools`
      # package that Google has since removed, which fails the whole action.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble
        run: gradle :app:assembleDebug --stacktrace

  ios:
    name: iOS remote
    # macos-14 is being retired: jobs on that label are cancelled during the
    # brownout windows and stop working entirely on 2026-11-02. macos-15 is the
    # current GA Apple Silicon image and ships an Xcode that still builds for the
    # iOS 15 deployment target this app declares.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Protocol kit tests (no Xcode project needed)
        run: swift test --package-path remote-ios/RemoteKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and build the app
        run: |
          cd remote-ios
          xcodegen generate
          xcodebuild -project CouchRemote.xcodeproj \
                     -scheme CouchRemote \
                     -destination 'generic/platform=iOS' \
                     -configuration Debug \
                     CODE_SIGNING_ALLOWED=NO \
                     build
