name: Companion remotes

on:
  push:
    branches: ["arena/**"]
    paths:
      - "remote-android/**"
      - "remote-ios/**"
      - "shared/**"
      - ".github/workflows/remote-remotes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android remote
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build everything, capture output
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --continue --console=plain --stacktrace > /tmp/build.log 2>&1
          echo "exit=$?" > /tmp/exit.txt

      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          log = open('/tmp/build.log', errors='replace').read().splitlines()
          keep = []
          for line in log:
              if line.startswith('> Task'):
                  continue
              s = line.strip()
              if (s.startswith('e: ') or s.startswith('w: ') or 'error:' in s
                      or s.startswith('FAILURE:') or s.startswith('* What went wrong')
                      or s.startswith('Caused by') or s.startswith('Execution failed')
                      or 'Task failed' in s or s.startswith('FAILED')
                      or 'tests completed' in s or 'AAPT' in s):
                  keep.append(line[:600])
          body = '## android remote diagnostics\n\n```\n'
          body += '\n'.join(keep[:1500]) or '(nothing matched)'
          body += '\n\n--- tail ---\n'
          body += '\n'.join(l[:600] for l in log[-40:])
          body += '\n```\n\nEXIT: ' + open('/tmp/exit.txt').read().strip() + '\n'
          open('/tmp/body.md','w').write(body[:200000])
          PY
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --field body="$(cat /tmp/body.md)" >/dev/null || echo "diagnostics comment failed"

  ios:
    name: iOS remote
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Protocol kit tests and app build, capture output
        run: |
          set +e
          {
            echo "=== swift test ==="
            swift test --package-path remote-ios/RemoteKit 2>&1
            echo "swift_exit=$?"
          } > /tmp/ios.log 2>&1
          brew install xcodegen >> /tmp/ios.log 2>&1
          {
            echo "=== xcodebuild ==="
            cd remote-ios
            xcodegen generate 2>&1
            xcodebuild -project CouchRemote.xcodeproj \
                       -scheme CouchRemote \
                       -destination 'generic/platform=iOS' \
                       -configuration Debug \
                       CODE_SIGNING_ALLOWED=NO \
                       build 2>&1
            echo "xcodebuild_exit=$?"
          } >> /tmp/ios.log 2>&1

      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          log = open('/tmp/ios.log', errors='replace').read().splitlines()
          keep = [l[:600] for l in log
                  if 'error:' in l or 'warning:' in l or '_exit=' in l or 'BUILD' in l or l.startswith('===') or 'Testing failed' in l or 'Compiling' in l or 'failed' in l.lower()]
          body = '## ios remote diagnostics\n\n```\n'
          body += '\n'.join(keep[:1500]) or '(nothing matched)'
          body += '\n\n--- tail ---\n'
          body += '\n'.join(l[:600] for l in log[-40:])
          body += '\n```\n'
          open('/tmp/body.md','w').write(body[:200000])
          PY
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --field body="$(cat /tmp/body.md)" >/dev/null || echo "diagnostics comment failed"
