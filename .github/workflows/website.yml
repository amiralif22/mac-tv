name: Website

on:
  push:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Every page is static
        run: |
          # The site must stay fully prerendered: any route that is not a file in .next/server/app
          # would mean a runtime dependency nobody asked for.
          test -f .next/server/app/index.html
          test -f .next/server/app/features.html
          test -f .next/server/app/download.html
          test -f .next/server/app/docs.html
