name: Android

on:
  push:
    paths:
      - "android-tv-launcher/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-tv-launcher/**"
      - "shared/**"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Check the APK is under the size budget
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($((SIZE/1024/1024)) MB)"
          test "$SIZE" -lt 31457280 || (echo "APK exceeds 30 MB" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: couch-tv-debug-apk
          path: android-tv-launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
