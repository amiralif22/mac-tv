name: Android

on:
  push:
    branches: ["arena/**"]
    paths:
      - "android-tv-launcher/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build everything, capture output
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --continue --console=plain --stacktrace > /tmp/build.log 2>&1
          echo "exit=$?" > /tmp/exit.txt
          wc -l /tmp/build.log

      - name: Publish diagnostics as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/build.log', errors='replace').read().splitlines()
          keep = []
          for line in log:
              s = line.strip()
              if (s.startswith('e: ') or s.startswith('w: file') or 'error:' in s
                      or s.startswith('FAILURE:') or s.startswith('* What went wrong')
                      or s.startswith('> ') or s.startswith('Caused by')
                      or s.startswith('Execution failed') or 'Task failed' in s):
                  keep.append(s)
              elif s.startswith('FAILED') or s.startswith('Tests failed') or 'tests completed' in s:
                  keep.append(s)
          text = '\n'.join(keep[-400:]) or '(no error lines matched)'
          text += '\n\nEXIT: ' + open('/tmp/exit.txt').read().strip()
          text += '\n\nTAIL:\n' + '\n'.join(log[-25:])
          text = text[:60000]
          msg = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=gradle::' + msg)
          PY
