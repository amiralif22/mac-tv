name: Android

on:
  push:
    paths:
      - "android-tv-launcher/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-tv-launcher/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v4 defaults to `platform-tools` only. v3's default was
      # `tools platform-tools`, and Google removed the legacy `tools` package, so
      # sdkmanager exits 1 ("Failed to find package 'tools'") and the job dies
      # here before Gradle ever runs. Name what the build actually needs:
      # app/build.gradle.kts compiles against SDK 34 with AGP 8.5.2.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Check the APK is under the size budget
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No debug APK was produced by :app:assembleDebug"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($((SIZE/1024/1024)) MB)"
          test "$SIZE" -lt 31457280 || (echo "APK exceeds 30 MB" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: couch-tv-debug-apk
          path: android-tv-launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
